<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070d" />
    <title>Impact Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-field" aria-hidden="true">
      <span class="bg-orb orb-cyan"></span>
      <span class="bg-orb orb-violet"></span>
      <span class="bg-grid"></span>
    </div>

    <div class="app-shell" id="app-shell">
      <span class="shell-glow" aria-hidden="true"></span>

      <div class="status-bar">
        <span>9:41</span>
        <div class="signal-group">
          <span class="signal-dot"></span>
          <span class="signal-dot"></span>
          <span class="signal-dot"></span>
        </div>
      </div>

      <main id="view-root" class="view-root"></main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Navigasi utama">
        <button type="button" class="nav-btn" data-nav="home" aria-label="Beranda">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9.5a.5.5 0 0 0 .5.5H10v-5a2 2 0 0 1 4 0v5h3.5a.5.5 0 0 0 .5-.5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <small>Beranda</small>
        </button>
        <button type="button" class="nav-btn" data-nav="tasks" aria-label="Daftar task">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 6h11M8 12h11M8 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          <small>Tasks</small>
        </button>
        <button type="button" class="nav-btn nav-btn-cta" data-nav="create" aria-label="Buat task">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="nav-btn" data-nav="bestiary" aria-label="Bestiary">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3c-4 0-7 3.2-7 8v8.2c0 .5.6.8 1 .4l1.8-1.6 1.8 1.6c.2.2.6.2.8 0l1.6-1.6 1.6 1.6c.2.2.6.2.8 0l1.8-1.6 1.8 1.6c.4.4 1 .1 1-.4V11c0-4.8-3-8-7-8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9.3" cy="10.5" r="1.1" fill="currentColor"/><circle cx="14.7" cy="10.5" r="1.1" fill="currentColor"/></svg>
          <small>Bestiary</small>
        </button>
        <button type="button" class="nav-btn" data-nav="stats" aria-label="Statistik">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <small>Statistik</small>
        </button>
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
